[package]
name = "wordseg-rs"
version = "0.2.1"
edition = "2021"
description = "Re-segment concatenated English text into words (stdin/stdout filter)"
license = "MIT"
repository = "https://github.com/jwu/wordseg-rs"
readme = "README.md"
keywords = ["word-segmentation", "text-processing", "asr", "nlp"]
categories = ["text-processing", "command-line-utilities"]
# Whitelist: the word list must ship with the crate because build.rs reads it,
# while target/ and the git metadata must not.
include = [
    "src/**",
    "build.rs",
    "data/**",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE",
]

[dependencies]

# Only used at build time to unzip the word list; nothing lands in the binary.
[build-dependencies]
flate2 = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3
